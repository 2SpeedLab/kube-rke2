- name: Deploy RKE2
  hosts: all
  become: yes
  vars_files:
    - group_vars/all.yml
  roles:
    - rke2_prepare
    - rke2_install
    - rke2_keepalived
    - rke2_kubevip
    - role: rke2_cilium
      cilium_role_phase: pre
    - rke2_cluster
    - role: rke2_cilium
      cilium_role_phase: post

- name: Post-install - Gateway API CRDs and disable ingress
  hosts: all
  become: yes
  vars_files:
    - group_vars/all.yml
  tags: gateway_api
  roles:
    - rke2_gateway_api

- name: Post-install - Copy kubeconfig to localhost with server IP
  hosts: masters
  become: yes
  vars_files:
    - group_vars/all.yml
  tags: kubeconfig
  roles:
    - rke2_kubeconfig
